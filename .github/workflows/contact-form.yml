name: Update contact form
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contact-form.yml'
      - '.github/scripts/migrate_contact.py'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: personal-contact-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply targeted contact form migration
        run: |
          python3 .github/scripts/migrate_contact.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text().replace('I will get back to you shortly. Check your email for a confirmation.', 'Your message has been sent to Joe. I will get back to you shortly.')
          p.write_text(s)
          PY
      - name: Commit website update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Connect personal contact form to Resend endpoint'
            git push
          fi
      - name: Prepare website artifact
        run: |
          mkdir -p public
          cp index.html CNAME public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
