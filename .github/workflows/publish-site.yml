name: Publish Website
on:
  push:
    branches: [main]
    paths:
      - 'ai-guide/content.md'
      - 'ai-guide/template.html'
      - 'ai-guide/build.py'
      - 'index.html'
      - 'CNAME'
      - '.github/workflows/publish-site.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: personal-contact-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build guide and preserve homepage
        run: |
          pip install Markdown==3.7
          python ai-guide/build.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-guide/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild AI guide from editable Markdown'
            git push
          fi
          mkdir -p public/ai-guide
          cp index.html CNAME public/
          cp ai-guide/index.html public/ai-guide/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
